name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary
        if: runner.os != 'Windows'
        run: strip "target/${{ matrix.target }}/release/agent-2pc"

      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail

          BIN_NAME="agent-2pc"
          ARCHIVE="agent-2pc-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"

          STAGING="agent-2pc-staging"
          rm -rf "${STAGING}"
          mkdir -p "${STAGING}"

          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "${STAGING}/"
          if [ -f "README.md" ]; then cp "README.md" "${STAGING}/"; fi
          if [ -f "LICENSE" ]; then cp "LICENSE" "${STAGING}/"; fi

          (cd "${STAGING}" && tar -czf "../${ARCHIVE}" *)
          rm -rf "${STAGING}"

      - name: Compute SHA256 checksum
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="agent-2pc-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          CHECKSUM="agent-2pc-${{ github.ref_name }}-${{ matrix.target }}.sha256"

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE}" > "${CHECKSUM}"
          else
            shasum -a 256 "${ARCHIVE}" > "${CHECKSUM}"
          fi

          echo "Checksum generated in ${CHECKSUM}:"
          cat "${CHECKSUM}"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: |
            agent-2pc-${{ github.ref_name }}-${{ matrix.target }}.*
          generate_release_notes: false
          fail_on_unmatched_files: true
